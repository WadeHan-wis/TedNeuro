# Rev0 | 기본 Zephyr(NCS) 스캐폴드 설정
# 보드/드라이버 세부 설정(NRFX_RTC 인스턴스, I2C, PWM, BT 등)은
# 실제 보드가 확정된 뒤 devicetree overlay(Application/app.overlay)와 함께 추가한다
# (architecture.md §11).

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# pinmap.md: PoC v1은 UART 핀이 노출되어 있지 않다 (SWD만 사용 가능) — 로그는
# UART 콘솔이 아니라 RTT(디버그 인터페이스로 전송)로만 확인 가능하다.
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# 기본 RTT up-buffer(1KB)는 "연결 중엔 로깅 안 함 -> 끊긴 뒤 한꺼번에 dump" 방식(m_ble_proto.c,
# 2026-09-15)과 맞지 않는다 — 세션 내내 아무도 안 읽고 있다가 disconnect 시점에 몰아서 로그를
# 찍으면 SEGGER_RTT_MODE_NO_BLOCK_SKIP(기본값) 특성상 버퍼가 가득 차서 뒷부분(정작 필요한
# write dump)이 유실됨을 실기에서 확인. 버퍼를 키워서 한 세션 분량 로그가 다 들어가게 한다.
# 이 버퍼는 "연결 없이 방치"용이라 buffer index 0(기본 terminal up-buffer) 기준으로 이
# 값(SEGGER_RTT_BUFFER_SIZE_UP)이 실제 크기를 결정한다 — LOG_BACKEND_RTT_BUFFER_SIZE는
# LOG_BACKEND_RTT_BUFFER>0(전용 버퍼 인덱스)일 때만 적용되는 별개 옵션이라 우리 구성(버퍼
# 인덱스 0 그대로 사용)에서는 의미가 없다(2026-09-28 확인, RTT 모드 재검토 중 교차검증).
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# [정정, 2026-09-28] Zephyr 로그 백엔드(LOG_BACKEND_RTT_MODE)는 위 SEGGER_RTT_MODE_UP과
# 완전히 별개 설정이다 — 지금까지 명시적으로 안 정해서 Zephyr 기본값인 MODE_BLOCK으로
# 동작하고 있었다(재시도 4회×5ms 후 드롭, log_backend_rtt.c 확인). CONFIG_LOG_MODE_DEFERRED
# 덕분에 이게 m_i2c/m_ble/m_ctrl 태스크를 막지는 않지만(로깅 전용 스레드만 재시도로 도는
# 구조), J-Link 연결 없이 오래 방치하면 매 로그 메시지마다 20ms씩 허비하고 결국 버림 — 즉
# "한참 뒤에 연결해서 그동안 쌓인 걸 본다"는 우리 실사용 시나리오에서 사실상 아무것도 안
# 쌓인다. OVERWRITE로 바꾸면 SEGGER_RTT_WriteWithOverwriteNoLock()을 직접 써서(SEGGER_RTT_MODE
# 설정과 무관하게 자체적으로 덮어쓰기 동작) 재시도 없이 즉시 기록하고, 버퍼가 차면 가장
# 오래된 로그부터 덮어써서 "최근 상황"이 항상 남는다 — watchdog fault injection/sensor
# fault recovery/배터리 자연방전처럼 장시간 무인 방치 후 이상 시점 직전 로그를 보는 우리
# 용도에 맞다(reset 자체의 원인은 RTT가 아니라 m_ctrl.c log_reset_cause()가 별도로
# GPREGRET 없이도 RESETREAS 레지스터로 다음 부팅 시 잡아준다 — RTT는 "전원 유지된 채
# 방치" 시나리오만 커버).
CONFIG_LOG_BACKEND_RTT_MODE_OVERWRITE=y

# DCDC(벅 컨버터) 레귤레이터 활성화(2026-09-28) — 기본값은 LDO(선형 레귤레이터, 남는
# 전압을 열로 버림)인데, 우리 보드는 이미 DCDC용 인덕터가 실장돼 있다(pinmap.md §5
# "DC/DC(DCC) pin47, L3(15nH)+L4(10uH)"). 데이터시트 기준 TX 전류가 거의 절반으로
# 줄어든다(0dBm 기준 11.6mA(LDO)→5.3mA(DCDC)). §8 배터리 8h 목표와 직결된 전력 최적화.
# [정정] CONFIG_SOC_DCDC_NRF52X는 이 NCS 버전에서 deprecated(prompt 없는 내부 심볼이라
# prj.conf에서 직접 대입 불가, 실제로 west build 에러로 확인) — devicetree
# (Application/app.overlay `&reg` 노드, regulator-initial-mode)로 설정한다.
# 전원부 전체에 영향을 주는 변경이라 실기 전류소비(AT-06)/전압 리플/기능 회귀(I2C·BLE)
# 검증 전까지는 "설정 켬"만으로 완료 처리하지 않는다.

CONFIG_MAIN_STACK_SIZE=2048

# m_ctrl_request_reset()의 sys_reboot() 호출에 필요 (architecture.md §3)
CONFIG_REBOOT=y

# Watchdog (Rev3, R3-1, 2026-09-16) — nRF52832 wdt0는 SoC dts에서 기본 status=okay라
# devicetree overlay 없이 이 옵션만으로 사용 가능 (m_ctrl.c 참고).
CONFIG_WATCHDOG=y

# RTC2를 nrfx로 직접 제어하기 위해 활성화 (architecture.md §2.3).
# 이 NCS 버전은 인스턴스별 Kconfig가 없고 NRFX_RTC 하나로 전체 RTC 드라이버를 켠다.
# IRQ 연결은 m_i2c_rtc.c에서 IRQ_CONNECT()로 직접 처리한다 (실기 검증 완료, 2026-09-14).
CONFIG_NRFX_RTC=y

# 클럭 트리 재계산 검증(2026-09-28, 트래커 "0. Baseline & Handover" 2번 항목) — LFCLK 소스는
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL이 기본값이라 이미 맞지만(pinmap.md §7 LFXO
# ECS-.327-12.5-12-TR, 외부 크리스탈 실장 확인), 정확도(ppm) 선언은 지금까지 손 안 대서
# Zephyr 기본값인 CLOCK_CONTROL_NRF_K32SRC_50PPM(31~50ppm)으로 남아있었다. 실제 실장
# 부품 데이터시트(ECS Inc. ECS-.327-12.5-12-TR) 기준 정확도는 **±20ppm**이라, 더 정확한
# CLOCK_CONTROL_NRF_K32SRC_20PPM으로 정정한다. 이 값은 BLE 컨트롤러가 연결 이벤트마다
# RX 윈도우를 얼마나 넓힐지(클럭 drift 보정 마진) 계산하는 데 쓰인다 — 과대평가(50ppm)
# 상태로 두면 안전하지만(더 넓게 여니 통신 실패 위험은 없음), RX 윈도우가 필요 이상으로
# 넓어져 라디오 on-time이 늘고 전력을 더 쓴다. 8h 배터리 목표(§8)와 관련된 낮은 리스크의
# 전력 최적화 항목.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_20PPM=y

# BLE TX power -8dBm 기본값. m_ble.c의 HCI VS Write TX Power는 BT_CTLR_TX_PWR_DYNAMIC_CONTROL이
# 꺼져 있으면 컨트롤러가 Unknown Command(0x01)로 거부해서 적용되지 않으므로, 컨트롤러 기본값으로 건다.
CONFIG_BT_CTLR_TX_PWR_MINUS_8=y

# LED PWM 구동 (pinmap.md §2, app.overlay의 pwm0 노드). PoC v1 실기 검증 완료(v0.0.3).
CONFIG_PWM=y

# AS7341 NIR1 I2C 드라이버 (pinmap.md §3, app.overlay의 i2c1 노드).
CONFIG_I2C=y

# BLE 실 스택 착수 (2026-09-15) — 테스트 APK(fnirs-visualizer-app-release.apk) 호환
# 연동이 목적이라, 정식 프로덕션 프로토콜(S2 정책: Tx power -8dBm 고정, MTU 251byte 등)은
# 아직 적용하지 않는다 (m_ble.c TODO 참고).
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
# [정책, 2026-09-22] 사용자 결정: 앞으로 이 값을 "TedNeuro_v{MAJOR}.{MINOR}.{PATCH}"
# 형식으로 매 패치 버전 상승 시 config_app.h(FW_VERSION_*)/Application/VERSION과
# 함께 갱신한다 — BLE 스캔/연결 시 앱이 디바이스 이름만 보고도 어떤 펌웨어 버전인지
# 바로 구분할 수 있게 하기 위함(advertising scan response에도 이 값이 그대로 실림,
# m_ble.c s_scan_rsp_data 참고). Kconfig 문자열이라 빌드 타임에 C 매크로를 자동
# 대입할 수는 없어 수동으로 맞춘다 — VERSION 파일 동기화와 동일한 패턴.
CONFIG_BT_DEVICE_NAME="TedNeuro_v0.1.38"

# [전력 최적화, 2026-09-21] 배칭(m_ble_proto.h v3)을 위해 MTU 협상/LE Data Length
# Update를 우리(peripheral)가 먼저 요청한다(m_ble.c on_connected() 참고).
# - BT_GATT_CLIENT: bt_gatt_exchange_mtu() 호출에 필요(GAP 역할과 무관하게 ATT MTU
#   교환은 GATT client 절차로 분류됨).
# - BT_USER_DATA_LEN_UPDATE: bt_conn_le_data_len_update() 호출에 필요. 실제 무선 PDU
#   크기(최대 251byte)는 컨트롤러가 이미 지원(CONFIG_BT_CTLR_DATA_LENGTH_MAX=251,
#   CONFIG_BT_BUF_ACL_TX_SIZE=251 등 board defconfig 기본값 확인됨, 2026-09-21) —
#   이 옵션은 그 능력을 "먼저 요청"하는 API만 켠다.
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y

# Safety 인증 대응(2026-09-17, architecture.md §11 항목6-[5]): BLE 페어링/본딩/암호화
# 설계는 준비하되, 테스트 APK가 본딩을 지원하는지 미확인 상태라 비활성으로 둔다.
# 활성화 시 m_ble_gatt.c의 BT_UUID_AS7341_CONFIG/DATA0/DATA1 characteristic permission을
# BT_GATT_PERM_*_ENCRYPT로 바꿔야 실제로 암호화가 강제된다 (앱 본딩 지원 확인 후 진행).
# 2026-09-21: 실제로 활성화했다가(v0.1.15) 같은 날 사용자 결정으로 롤백 — 지금 단계에서는
# "끊기면 advertising 재개 후 재연결"만 되면 충분하고(기존 구조로 이미 동작), 본딩까지는
# 아직 필요 없다고 판단. 재검토 시 CHANGELOG.md v0.1.15(롤백됨) 참고.
# CONFIG_BT_SMP=y
# CONFIG_BT_BONDABLE=y

# OTA(DFU) — Safety 인증 대응(2026-09-17, architecture.md §11 항목6-[6]): MCUboot 골격
# (sysbuild.conf) 위에 SMP-over-BLE 이미지 관리 활성화. 서명키는 sysbuild 기본
# 자동생성 디버그 키 사용(프로덕션 키 관리는 별도 범위, architecture.md §11 보류 항목).
# 실기 업데이트/롤백/강제전원차단 3-시나리오 검증은 하드웨어 검증 단계에서 진행한다.
# 2026-09-17 OTA 실기 테스트 중 "GATT ERROR"로 업데이트 실패 — 원인은 손으로 하나씩
# 넣은 위 설정에 MCUMGR_TRANSPORT_BT_REASSEMBLY(SMP 패킷 재조립, 기본 ATT MTU=23byte로는
# 큰 업로드 요청이 여러 조각으로 나뉘는데 재조립 없이는 깨짐)가 빠져 있었기 때문으로
# 추정. NCS가 제공하는 공식 검증 번들(samples/common/mcumgr_bt_ota_dfu/Kconfig)로
# 교체 — reassembly/버퍼크기/연결파라미터 제어를 한 번에 올바르게 설정해준다.
# BT_SMP 비활성 상태에서는 MCUMGR_TRANSPORT_BT_PERM이 자동으로 암호화 불필요
# 옵션(_RW)을 선택한다 — 위 [5]의 보안 비활성 결정과 일관됨.
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU_SPEEDUP=y

# Watchdog 리셋 후 안전 재시작 시퀀스(2026-09-17, architecture.md §11 항목6-[2]) —
# RESETREAS 레지스터로 이전 리셋 원인을 읽기 위함 (m_ctrl.c log_reset_cause() 참고).
CONFIG_HWINFO=y

# 모듈 오류 재부팅 에스컬레이션(2026-09-29, config_app.h CTRL_MODULE_FAULT_REBOOT_MAX
# 참고) — 재부팅 횟수를 GPREGRET(POR 전까지 유지)에 저장하기 위한 retained_mem 드라이버.
# gpregret1 devicetree 노드는 nrf52832.dtsi에 이미 status="okay"라 overlay 불필요.
CONFIG_RETAINED_MEM=y
